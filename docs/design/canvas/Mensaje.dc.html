<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    sc-for, sc-if { display: contents; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #5B2FE3; text-decoration: none; }
    a:hover { color: #4522B5; }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .noscroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5FC; color: #1B1630;">

  <div style="height: 62px; display: flex; align-items: center; gap: 4px; padding: 14px 16px 0;">
    <button aria-label="Volver" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #5B2FE3;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
    </button>
    <span style="flex: 1 1 auto; font-size: 20px; font-weight: 700; letter-spacing: -0.4px;">Mensajes</span>
    <span class="num" style="font-size: 13px; font-weight: 700; color: #5B2FE3; background: #EFE9FF; padding: 6px 12px; border-radius: 999px;">{{counter}}</span>
  </div>

  <sc-if value="{{active}}" hint-placeholder-val="{{true}}">
    <div class="noscroll" style="position: absolute; top: 62px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 6px 20px 216px; scrollbar-width: none;">

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(60,30,140,0.06);">
        <span style="width: 46px; height: 46px; flex: 0 0 46px; border-radius: 999px; background: #F1ECFF; color: #5B2FE3; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{person.initial}}</span>
        <span style="min-width: 0; flex: 1 1 auto;">
          <span style="display: block; font-size: 18px; font-weight: 700; letter-spacing: -0.3px;">{{person.name}}</span>
          <span style="display: block; font-size: 13px; color: #857D9B; margin-top: 1px;">{{person.reason}}</span>
        </span>
        <span class="num" style="font-size: 19px; font-weight: 700; letter-spacing: -0.5px; color: {{person.tone}};">{{person.amount}}</span>
      </div>

      <div class="noscroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 6px; scrollbar-width: none;">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button onClick="{{o.pick}}" style="flex: 0 0 auto; display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-size: 15px; font-weight: 600; border: 1.5px solid {{o.border}};">
            <sc-if value="{{o.suggested}}" hint-placeholder-val="{{true}}">
              <span style="width: 7px; height: 7px; border-radius: 999px; background: {{o.dot}};"></span>
            </sc-if>
            {{o.label}}
          </button>
        </sc-for>
      </div>

      <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; box-shadow: 0 2px 10px rgba(60,30,140,0.06);">
        <div style="display: flex; justify-content: flex-end;">
          <div style="max-width: 290px; background: #EFE9FF; border-radius: 20px 20px 6px 20px; padding: 14px 16px;">
            <span style="display: block; font-size: 16px; line-height: 1.45; white-space: pre-line; color: #241A47;">{{message}}</span>
          </div>
        </div>
        <button style="display: flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 6px; font-size: 15px; font-weight: 700; color: #5B2FE3;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.2 8.8a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6 4 20Z"></path></svg>
          Cambiar el texto
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 20px; padding: 12px 14px; margin-top: 16px; box-shadow: 0 2px 8px rgba(60,30,140,0.05);">
        <span style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 999px; background: #F4F1FC; color: #857D9B; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{next.initial}}</span>
        <span style="min-width: 0; flex: 1 1 auto;">
          <span style="display: block; font-size: 13px; font-weight: 600; color: #857D9B;">Sigue</span>
          <span style="display: block; font-size: 15px; font-weight: 600; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{next.line}}</span>
        </span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 62px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 40px 80px; text-align: center;">
      <span style="width: 88px; height: 88px; border-radius: 999px; background: #DDF7EA; color: #12B36A; display: flex; align-items: center; justify-content: center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      </span>
      <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.6px;">Ya les escribiste a todas</span>
      <button onClick="{{restart}}" style="min-height: 50px; padding: 0 24px; border-radius: 999px; background: #EFE9FF; color: #4522B5; font-size: 16px; font-weight: 700;">Empezar de nuevo</button>
    </div>
  </sc-if>

  <sc-if value="{{active}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 20px 26px; background: linear-gradient(to top, #F7F5FC 66%, rgba(247,245,252,0));">
      <a href="{{waHref}}" target="_blank" rel="noopener noreferrer" style="width: 100%; min-height: 58px; border-radius: 999px; background: #12B36A; color: #FFFFFF; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 24px rgba(18,179,106,0.30);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.2 8.2 0 0 1-11.9 7.3L3.5 20.5l1.6-5.1a8.2 8.2 0 1 1 15.4-3.8Z"></path></svg>
        Abrir WhatsApp
      </a>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button style="flex: 1 1 0; min-height: 50px; border-radius: 999px; background: #FFFFFF; color: #4522B5; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(60,30,140,0.06);">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h10v11H9zM15 9V4H5v11h4"></path></svg>
          Copiar
        </button>
        <button onClick="{{skip}}" style="flex: 1 1 0; min-height: 50px; border-radius: 999px; background: #FFFFFF; color: #4522B5; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(60,30,140,0.06);">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
          Ya le escribí
        </button>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const OPTIONS = [
  { key: 'confirmar', label: 'Confirmar' },
  { key: 'cobrar', label: 'Cobrar' },
  { key: 'llego', label: 'Ya llegó' },
  { key: 'corte', label: 'Se cierra el catálogo' },
]

const QUEUE = [
  {
    initial: 'K',
    name: 'Karla Pérez',
    reason: 'falta el saldo · 3 días',
    amount: '$22.30',
    tone: '#E11D48',
    phone: '593984452210',
    suggested: 'cobrar',
    total: '$54.30',
    saldo: '$22.30',
    items: '• 1x 38588 Novage Ultimate Lift\n• 2x 41720 Giordani Gold labial',
  },
  {
    initial: 'D',
    name: 'Doris Chango',
    reason: 'sin confirmar · 1 día',
    amount: '$18.90',
    tone: '#1B1630',
    phone: '593988120034',
    suggested: 'confirmar',
    total: '$18.90',
    saldo: '$18.90',
    items: '• 1x 35450 Milk & Honey crema\n• 1x 33961 Love Nature shampoo',
  },
  {
    initial: 'M',
    name: 'Mayra Lligalo',
    reason: 'ya llegó, falta entregar',
    amount: '$41.10',
    tone: '#F08C00',
    phone: '593982207719',
    suggested: 'llego',
    total: '$41.10',
    saldo: '$0.00',
    items: '• 1x 30621 Optimals Even Out\n• 3x 33961 Love Nature shampoo',
  },
]

class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { index: 0, chosen: null }
  }

  first(name) {
    return name.split(' ')[0]
  }

  body(key, p) {
    const name = this.first(p.name)
    if (key === 'confirmar') {
      return 'Hola ' + name + '! Te anoté esto del live:\n' + p.items + '\nSon ' + p.total + '. ¿Te lo confirmo?'
    }
    if (key === 'cobrar') {
      return name + ', de tu pedido quedan ' + p.saldo + '.\n[TUS DATOS BANCARIOS]\nCuando hagas la transferencia me mandas la captura y te confirmo.'
    }
    if (key === 'llego') {
      return name + ', ya llegó tu pedido. ¿Cuándo te queda bien pasar a retirarlo?'
    }
    return name + ', el catálogo cierra el 8 de septiembre. Si querías aumentar algo dime hasta ahí, después ya no alcanzo a meterlo en este pedido.'
  }

  renderVals() {
    const s = this.state
    const person = QUEUE[s.index]
    const finished = person === undefined

    if (finished) {
      return {
        active: false,
        finished: true,
        counter: QUEUE.length + ' de ' + QUEUE.length,
        restart: () => this.setState({ index: 0, chosen: null }),
        person: { initial: '', name: '', reason: '', amount: '', tone: '#1B1630' },
        next: { initial: '', line: '' },
        options: [],
        message: '',
        waHref: '#',
        skip: () => {},
      }
    }

    const key = s.chosen ?? person.suggested
    const message = this.body(key, person)
    const following = QUEUE[s.index + 1]

    return {
      active: true,
      finished: false,
      counter: s.index + 1 + ' de ' + QUEUE.length,
      person,
      message,
      waHref: 'https://wa.me/' + person.phone + '?text=' + encodeURIComponent(message),
      skip: () => this.setState({ index: s.index + 1, chosen: null }),
      restart: () => this.setState({ index: 0, chosen: null }),
      next: following
        ? { initial: following.initial, line: following.name + ' — ' + following.reason }
        : { initial: '·', line: 'Nadie más por hoy' },
      options: OPTIONS.map((o) => {
        const on = o.key === key
        return {
          label: o.label,
          suggested: o.key === person.suggested,
          dot: on ? '#FFFFFF' : '#5B2FE3',
          bg: on ? '#5B2FE3' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#4A4360',
          border: on ? '#5B2FE3' : '#E7E1F5',
          pick: () => this.setState({ chosen: o.key }),
        }
      }),
    }
  }
}
</script>
</body>
</html>
